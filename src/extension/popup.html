<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>TypeThru</title>
<style>
  body { font: 13px system-ui, sans-serif; width: 270px; margin: 12px; }
  input[type=password], input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; font-size: 14px; }
  label { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
  select { width: 100%; padding: 4px; font-size: 13px; }
  button { width: 100%; padding: 6px; font-size: 13px; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  #target { font-size: 11px; color: #555; margin-bottom: 8px; word-break: break-all; }
  #status { margin-top: 8px; min-height: 1.2em; }
  .ok { color: #157a2b; } .err { color: #b3261e; }
  footer { margin-top: 10px; font-size: 11px; text-align: right; }
  footer a { color: #0b5cad; }
  details { margin-top: 8px; font-size: 11px; }
  summary { cursor: pointer; color: #0b5cad; }
  pre { max-height: 180px; overflow: auto; background: #f4f4f4; padding: 6px; white-space: pre-wrap; word-break: break-all; user-select: all; }
</style>
</head>
<body>
  <div id="target">Looking for console…</div>
  <input id="text" type="password" placeholder="Text / password" autofocus autocomplete="off" spellcheck="false">
  <label><input id="show" type="checkbox"> Show text</label>
  <label for="layout">Guest keyboard layout</label>
  <select id="layout"></select>
  <label><input id="enforce" type="checkbox" disabled> Console: enforce US keyboard layout</label>
  <button id="send" disabled>Send</button>
  <div id="status"></div>
  <details id="diag"><summary>Diagnostics</summary><p>Copy this into an issue when reporting a problem. It does not contain your text.</p><pre id="diagOut">Collecting…</pre></details>
  <footer><a id="options" href="#">Options</a></footer>
  <script src="popup.js"></script>
</body>
</html>
