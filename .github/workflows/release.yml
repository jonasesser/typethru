name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Package
        run: |
          mkdir -p release
          (cd dist/extension && zip -qr "../../release/typethru-extension-$VERSION.zip" .)
          cp dist/bookmarklet/install.html "release/typethru-bookmarklet-$VERSION.html"
          (cd dist/tools && zip -qr "../../release/typethru-tools-$VERSION.zip" .)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "TypeThru $VERSION" \
            --generate-notes
